[package]
name = "rango-framework"
version = "0.1.0"
edition = "2021"
authors = ["Marie Martinot De Salles DERANDRAINY"]
description = "A powerful, Django-like async web framework built on top of Axum and Tokio."
homepage = "https://github.com/Dera2Salles/Rango"
repository = "https://github.com/Dera2Salles/Rango"
license = "MIT"

[lib]
name = "rango"

[features]
default = ["templates"]
templates = ["minijinja"]
db = ["sqlx"]
auth = ["tower-sessions", "argon2", "rand", "subtle", "hex"]

[dependencies]
rango_macros = { version = "0.1.0", path = "../macros" }

axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.52", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }

minijinja = { version = "2.21", features = ["loader", "json"], optional = true }

sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "sqlite",
    "postgres",
    "mysql",
    "any",
    "migrate",
    "macros",
    "chrono",
    "uuid",
    "json",
], optional = true }

tower-sessions = { version = "0.12", optional = true }
argon2 = { version = "0.5", optional = true }
rand = { version = "0.8", optional = true }

subtle = { version = "2.6", optional = true }

hex = { version = "0.4", optional = true }

[dev-dependencies]
tokio = { version = "1.52", features = ["full", "test-util"] }
