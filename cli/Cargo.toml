[package]
name = "rango-cli"
version = "0.1.0"
edition = "2021"

authors = ["Marie Martinot De Salles DERANDRAINY"]
description = "A powerful, Django-like async web framework CLI for Rust."
homepage = "https://github.com/Dera2Salles/Rango"
repository = "https://github.com/Dera2Salles/Rango"
license = "MIT"

[[bin]]
name = "rango"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
thiserror = "1.0"
tokio = { version = "1.52", features = ["full"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "sqlite",
    "postgres",
    "any",
    "migrate",
] }
